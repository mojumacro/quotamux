name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest tests/ -q
      # 测试不打任何外部网络：全部用假注册表/打桩，CI 里必须能离线跑绿
      - name: CLI smoke
        run: |
          quotamux --help
          quotamux --json || true    # 无订阅配置时应优雅退出（退出码 1），不许崩
